[package]
name = "calipso"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "calipso_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "calipso"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_2"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
