<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calipso</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --bar: #181818;
    --border: #333; --text: #d4d4d4; --muted: #888;
    --accent: #4ea1ff; --accent-dim: #2d6cb0; --dirty: #e2c08d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", sans-serif;
               background: var(--bg); color: var(--text); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 12px; height: 40px;
           padding: 0 14px; background: var(--bar); border-bottom: 1px solid var(--border);
           font-size: 13px; flex: 0 0 auto; }
  header .logo { font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  header .proj { color: var(--muted); }
  header .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  header .status.dirty { color: var(--dirty); }
  header .status.saved { color: #6a9955; }
  .toolbtn { background: transparent; border: 1px solid var(--border); color: var(--text);
             border-radius: 6px; height: 26px; padding: 0 9px; font-size: 12px;
             cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .toolbtn:hover { border-color: #555; background: #222; }
  .toolbtn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
           background: var(--accent-dim); color: #fff; display: inline-flex;
           align-items: center; justify-content: center; font-size: 11px; }
  main { display: flex; flex: 1 1 auto; min-height: 0; }
  #sidebar { width: 270px; flex: 0 0 auto; background: var(--panel);
             border-right: 1px solid var(--border); overflow: auto; padding: 6px 0; }
  #sidebar .title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
                    color: var(--muted); padding: 6px 14px; }
  ul.tree { list-style: none; margin: 0; padding: 0; }
  ul.tree ul { list-style: none; margin: 0; padding-left: 14px; }
  .node { display: flex; align-items: center; gap: 6px; padding: 3px 14px;
          cursor: pointer; font-size: 13px; white-space: nowrap; user-select: none; }
  .node:hover { background: #2a2d2e; }
  .node.active { background: var(--accent-dim); color: #fff; }
  .node .ico { min-width: 24px; text-align: left; opacity: .85; font-size: 11px; color: var(--muted); }
  .dir > .node .caret { min-width: 12px; transition: transform .12s; }
  .dir.collapsed > .node .caret { transform: rotate(-90deg); }
  .dir.collapsed > ul { display: none; }
  #editor { flex: 1 1 auto; min-width: 0; }
  #placeholder { display: flex; align-items: center; justify-content: center;
                 height: 100%; color: var(--muted); font-size: 14px; }
  #chat { width: 380px; flex: 0 0 auto; display: flex; flex-direction: column;
          background: var(--panel); border-left: 1px solid var(--border); }
  #chat .chat-title { font-size: 12px; font-weight: 600; color: var(--accent);
                      padding: 8px 14px; border-bottom: 1px solid var(--border); }
  #messages { flex: 1 1 auto; overflow: auto; padding: 12px; display: flex;
              flex-direction: column; gap: 10px; }
  .msg { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
         padding: 8px 11px; border-radius: 8px; max-width: 92%; }
  .msg.user { align-self: flex-end; background: var(--accent-dim); color: #fff; }
  .msg.bot  { align-self: flex-start; background: #2d2d30; }
  .msg.meta { align-self: center; background: transparent; color: var(--muted);
              font-size: 11px; padding: 1px 6px; max-width: 100%; }
  #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
  #input { flex: 1 1 auto; resize: none; height: 44px; background: var(--bg);
           color: var(--text); border: 1px solid var(--border); border-radius: 8px;
           padding: 8px 10px; font-family: inherit; font-size: 13px; }
  #input:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 8px;
          min-width: 60px; font-size: 13px; cursor: pointer; }
  #send:disabled { opacity: .4; cursor: default; }
  .drawer { position: fixed; top: 40px; right: 0; bottom: 0; width: min(680px, 92vw);
            background: #202020; border-left: 1px solid var(--border);
            z-index: 20; display: none; flex-direction: column; box-shadow: -16px 0 40px #0008; }
  .drawer.open { display: flex; }
  .drawer-head { height: 42px; display: flex; align-items: center; gap: 8px;
                 padding: 0 12px; border-bottom: 1px solid var(--border); }
  .drawer-head strong { color: var(--accent); font-size: 13px; }
  .drawer-head .spacer { flex: 1; }
  #changesBody { display: grid; grid-template-columns: 220px 1fr; min-height: 0; flex: 1; }
  #changedFiles { border-right: 1px solid var(--border); overflow: auto; padding: 8px 0; }
  .change-row { padding: 7px 10px; font-size: 12px; cursor: pointer; display: flex;
                gap: 7px; align-items: center; min-width: 0; }
  .change-row:hover, .change-row.active { background: #2a2d2e; }
  .change-code { color: var(--dirty); width: 28px; flex: 0 0 auto; font-family: Consolas, monospace; }
  .change-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #diffView { margin: 0; padding: 12px; overflow: auto; font-family: Consolas, monospace;
              font-size: 12px; line-height: 1.45; white-space: pre; color: #d4d4d4; }
  .empty { color: var(--muted); font-size: 13px; padding: 14px; }
  #configBody { padding: 14px; overflow: auto; display: grid; gap: 12px; }
  .config-grid { display: grid; grid-template-columns: 150px 1fr; gap: 8px 10px; align-items: center; }
  label { color: var(--muted); font-size: 12px; }
  input, select { background: var(--bg); color: var(--text); border: 1px solid var(--border);
                  border-radius: 6px; padding: 8px; font-family: inherit; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">Calipso</span>
    <span class="proj" id="proj">-</span>
    <button class="toolbtn" id="changesBtn" title="Ver cambios">Cambios <span class="badge" id="changesCount">0</span></button>
    <button class="toolbtn" id="proposeBtn" title="Guardar como propuesta">Proponer</button>
    <button class="toolbtn" id="configBtn" title="Configurar harness">Config</button>
    <span class="status" id="status">listo</span>
  </header>
  <main>
    <nav id="sidebar">
      <div class="title">Explorador</div>
      <ul class="tree" id="tree"></ul>
    </nav>
    <div id="editor"><div id="placeholder">Selecciona un archivo del explorador</div></div>
    <aside id="chat">
      <div class="chat-title">Habla con Calipso</div>
      <div id="messages"></div>
      <div id="composer">
        <textarea id="input" placeholder="Hablale a Calipso...  (Enter envia, Shift+Enter salto)"></textarea>
        <button id="send" title="Enviar">Enviar</button>
      </div>
    </aside>
  </main>
  <section class="drawer" id="changesPanel" aria-label="Cambios">
    <div class="drawer-head">
      <strong>Cambios</strong>
      <span class="proj" id="gitBranch">Git</span>
      <span class="spacer"></span>
      <button class="toolbtn primary" id="applyProposal" disabled>Aplicar</button>
      <button class="toolbtn" id="discardProposal" disabled>Descartar</button>
      <button class="toolbtn" id="refreshChanges">Actualizar</button>
      <button class="toolbtn" id="closeChanges">Cerrar</button>
    </div>
    <div id="changesBody">
      <div id="changedFiles"></div>
      <pre id="diffView">Sin cambios.</pre>
    </div>
  </section>
  <section class="drawer" id="configPanel" aria-label="Config">
    <div class="drawer-head">
      <strong>Harness</strong>
      <span class="proj">rutas y modelos</span>
      <span class="spacer"></span>
      <button class="toolbtn primary" id="saveConfig">Guardar</button>
      <button class="toolbtn" id="closeConfig">Cerrar</button>
    </div>
    <div id="configBody">
      <div class="hint">Preferencia actual: usar suscripciones primero para tareas fuertes; API solo cuando se fuerce o cuando una ruta configurada lo pida.</div>
      <div class="config-grid">
        <label for="cfgPolicy">Politica</label><select id="cfgPolicy"><option value="subscription_first">Suscripcion primero</option><option value="balanced">Balanceado</option><option value="local_first">Local primero</option></select>
        <label for="cfgSubClient">Suscripcion</label><select id="cfgSubClient"><option value="claude">Claude</option><option value="codex">Codex</option></select>
        <label for="cfgApiModel">Modelo API</label><input id="cfgApiModel" placeholder="deepseek-chat" />
        <label for="cfgLocalModel">Modelo local</label><input id="cfgLocalModel" placeholder="qwen2.5:7b" />
        <label for="cfgClassModel">Clasificador</label><input id="cfgClassModel" placeholder="qwen2.5:3b" />
      </div>
      <div class="hint" id="configSaved"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
const EXT_LANG = {
  py:"python", js:"javascript", ts:"typescript", jsx:"javascript", tsx:"typescript",
  json:"json", html:"html", css:"css", md:"markdown", yaml:"yaml", yml:"yaml",
  sh:"shell", ps1:"powershell", sql:"sql", go:"go", rs:"rust", java:"java",
  c:"c", h:"c", cpp:"cpp", txt:"plaintext", toml:"ini", ini:"ini", xml:"xml",
};
let editor = null, currentPath = null, dirty = false, monacoReady;

function setStatus(text, cls) {
  const s = document.getElementById("status");
  s.textContent = text; s.className = "status" + (cls ? " " + cls : "");
}
function markDirty(d) {
  dirty = d;
  if (!currentPath) return setStatus("listo");
  setStatus((d ? "* " : "") + currentPath + (d ? " - sin guardar" : " - guardado"),
            d ? "dirty" : "saved");
}

require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs" } });
monacoReady = new Promise(res => require(["vs/editor/editor.main"], () => {
  document.getElementById("placeholder")?.remove();
  editor = monaco.editor.create(document.getElementById("editor"), {
    value: "", language: "plaintext", theme: "vs-dark",
    automaticLayout: true, fontSize: 13, minimap: { enabled: true },
  });
  editor.onDidChangeModelContent(() => { if (!dirty) markDirty(true); });
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveFile);
  res();
}));

async function loadTree() {
  const r = await fetch("/api/tree"); const data = await r.json();
  document.getElementById("proj").textContent = data.root;
  document.getElementById("tree").innerHTML = "";
  renderNodes(data.tree, document.getElementById("tree"));
}
function renderNodes(nodes, parent) {
  for (const n of nodes) {
    const li = document.createElement("li");
    if (n.type === "dir") {
      li.className = "dir";
      const node = nodeRow("v", "dir", n.name);
      node.onclick = () => li.classList.toggle("collapsed");
      li.appendChild(node);
      const ul = document.createElement("ul");
      renderNodes(n.children, ul); li.appendChild(ul);
    } else {
      const node = nodeRow("", fileIcon(n.name), n.name);
      node.dataset.path = n.path;
      node.onclick = () => openFile(n.path, node);
      li.appendChild(node);
    }
    parent.appendChild(li);
  }
}
function nodeRow(caret, ico, name) {
  const div = document.createElement("div"); div.className = "node";
  div.innerHTML = `<span class="ico caret">${caret}</span><span class="ico">${ico}</span><span>${name}</span>`;
  return div;
}
function fileIcon(name) {
  const e = name.split(".").pop().toLowerCase();
  return ({py:"py", md:"md", json:"json", html:"html", js:"js", ts:"ts"})[e] || "file";
}
function langFor(path) { return EXT_LANG[path.split(".").pop().toLowerCase()] || "plaintext"; }

async function openFile(path, node) {
  if (dirty && !confirm("Hay cambios sin guardar. Descartar?")) return;
  await monacoReady;
  const r = await fetch("/api/file?path=" + encodeURIComponent(path));
  if (!r.ok) { setStatus("error: " + (await r.json()).detail, "dirty"); return; }
  const data = await r.json();
  const model = monaco.editor.createModel(data.content, langFor(path));
  editor.setModel(model);
  currentPath = path;
  document.querySelectorAll(".node.active").forEach(n => n.classList.remove("active"));
  node.classList.add("active");
  markDirty(false);
}

async function saveFile() {
  if (!currentPath) return;
  setStatus("guardando...");
  const r = await fetch("/api/file", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: currentPath, content: editor.getValue() }),
  });
  if (r.ok) { markDirty(false); loadGitStatus(); }
  else setStatus("error al guardar", "dirty");
}

window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveFile(); }
});
loadTree();

const changesPanel = document.getElementById("changesPanel");
const changesBtn = document.getElementById("changesBtn");
const changesCount = document.getElementById("changesCount");
const changedFiles = document.getElementById("changedFiles");
const diffView = document.getElementById("diffView");
const gitBranch = document.getElementById("gitBranch");
const applyProposal = document.getElementById("applyProposal");
const discardProposal = document.getElementById("discardProposal");
let selectedProposalId = null;

function statusLabel(file) {
  if (file.status === "??") return "nuevo";
  if (file.index === "D" || file.worktree === "D") return "borrado";
  if (file.index === "A") return "agregado";
  if (file.index === "M" || file.worktree === "M") return "modificado";
  if (file.index === "R") return "renombrado";
  return file.status.trim() || "cambio";
}
async function loadGitStatus() {
  try {
    selectedProposalId = null;
    applyProposal.disabled = true;
    discardProposal.disabled = true;
    const pr = await fetch("/api/proposals");
    const proposals = pr.ok ? (await pr.json()).proposals : [];
    const r = await fetch("/api/git/status");
    const data = await r.json();
    if (!data.available) {
      changesCount.textContent = proposals.length || "-";
      gitBranch.textContent = "sin git";
      changedFiles.innerHTML = '<div class="empty">Git no esta disponible.</div>';
      return;
    }
    changesCount.textContent = data.files.length + proposals.length;
    gitBranch.textContent = data.branch || "Git";
    if (!data.files.length && !proposals.length) {
      changedFiles.innerHTML = '<div class="empty">Sin cambios.</div>';
      diffView.textContent = "Sin cambios.";
      return;
    }
    changedFiles.innerHTML = "";
    for (const p of proposals) {
      const row = document.createElement("div");
      row.className = "change-row";
      row.innerHTML = `<span class="change-code">P</span><span class="change-path" title="${p.path}">${p.path}</span>`;
      row.onclick = () => selectProposal(row, p.id);
      changedFiles.appendChild(row);
    }
    for (const f of data.files) {
      const row = document.createElement("div");
      row.className = "change-row";
      row.innerHTML = `<span class="change-code">${f.status}</span><span class="change-path" title="${f.path}">${f.path}</span>`;
      row.onclick = () => selectChangedFile(row, f.path, statusLabel(f));
      changedFiles.appendChild(row);
    }
  } catch (e) {
    changesCount.textContent = "!";
    changedFiles.innerHTML = '<div class="empty">No pude leer los cambios.</div>';
  }
}
async function selectChangedFile(row, path, label) {
  selectedProposalId = null;
  applyProposal.disabled = true;
  discardProposal.disabled = true;
  document.querySelectorAll(".change-row.active").forEach(n => n.classList.remove("active"));
  row.classList.add("active");
  diffView.textContent = "Cargando diff...";
  const r = await fetch("/api/git/diff?path=" + encodeURIComponent(path));
  if (!r.ok) {
    diffView.textContent = "No pude cargar el diff.";
    return;
  }
  const data = await r.json();
  diffView.textContent = data.diff || `Sin diff textual para ${path} (${label}).`;
}
async function selectProposal(row, id) {
  selectedProposalId = id;
  applyProposal.disabled = false;
  discardProposal.disabled = false;
  document.querySelectorAll(".change-row.active").forEach(n => n.classList.remove("active"));
  row.classList.add("active");
  diffView.textContent = "Cargando propuesta...";
  const r = await fetch(`/api/proposals/${id}/diff`);
  if (!r.ok) {
    diffView.textContent = "No pude cargar la propuesta.";
    return;
  }
  const data = await r.json();
  diffView.textContent = data.diff || `Propuesta sin diff textual para ${data.path}.`;
}
changesBtn.onclick = () => { changesPanel.classList.add("open"); loadGitStatus(); };
document.getElementById("closeChanges").onclick = () => changesPanel.classList.remove("open");
document.getElementById("refreshChanges").onclick = loadGitStatus;
document.getElementById("proposeBtn").onclick = async () => {
  if (!currentPath || !editor) return;
  const r = await fetch("/api/proposals", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: currentPath, content: editor.getValue(), source: "editor" }),
  });
  if (r.ok) {
    dirty = false;
    changesPanel.classList.add("open");
    await loadGitStatus();
    setStatus(currentPath + " - propuesta pendiente", "dirty");
  } else {
    setStatus("no pude crear propuesta", "dirty");
  }
};
applyProposal.onclick = async () => {
  if (!selectedProposalId) return;
  await fetch(`/api/proposals/${selectedProposalId}/apply`, { method: "POST" });
  selectedProposalId = null;
  applyProposal.disabled = true;
  discardProposal.disabled = true;
  await loadTree();
  await loadGitStatus();
};
discardProposal.onclick = async () => {
  if (!selectedProposalId) return;
  await fetch(`/api/proposals/${selectedProposalId}`, { method: "DELETE" });
  selectedProposalId = null;
  applyProposal.disabled = true;
  discardProposal.disabled = true;
  await loadGitStatus();
};
loadGitStatus();

const configPanel = document.getElementById("configPanel");
document.getElementById("configBtn").onclick = () => { configPanel.classList.add("open"); loadConfig(); };
document.getElementById("closeConfig").onclick = () => configPanel.classList.remove("open");
async function loadConfig() {
  const r = await fetch("/api/config");
  if (!r.ok) return;
  const cfg = await r.json();
  document.getElementById("cfgPolicy").value = cfg.routing?.policy || "subscription_first";
  document.getElementById("cfgSubClient").value = cfg.routing?.subscription_client || "claude";
  document.getElementById("cfgApiModel").value = cfg.api?.model || "";
  document.getElementById("cfgLocalModel").value = cfg.local?.model || "";
  document.getElementById("cfgClassModel").value = cfg.classifier?.model || "";
}
document.getElementById("saveConfig").onclick = async () => {
  const body = {
    routing: {
      policy: document.getElementById("cfgPolicy").value,
      subscription_client: document.getElementById("cfgSubClient").value,
    },
    api: { model: document.getElementById("cfgApiModel").value.trim() },
    local: { model: document.getElementById("cfgLocalModel").value.trim() },
    classifier: { model: document.getElementById("cfgClassModel").value.trim() },
  };
  const r = await fetch("/api/config", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  document.getElementById("configSaved").textContent = r.ok ? "Configuracion guardada." : "No pude guardar.";
};

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let ws = null, botEl = null, busy = false;

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls; div.textContent = text || "";
  messages.appendChild(div); messages.scrollTop = messages.scrollHeight;
  return div;
}
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "meta") {
      let t = `-> ${m.used || m.route}`;
      if (m.note) t += ` - ${m.note}`;
      if (m.why) t += ` - ${m.why}`;
      addMsg("meta", t);
      if (!botEl) botEl = addMsg("bot", "");
    } else if (m.type === "chunk") {
      if (!botEl) botEl = addMsg("bot", "");
      botEl.textContent += m.text; messages.scrollTop = messages.scrollHeight;
    } else if (m.type === "cost") {
      const c = m.cost_usd > 0 ? `$${m.cost_usd.toFixed(4)}` : "gratis";
      addMsg("meta", `$ ${m.route} - ${m.tokens} tokens - ${c}`);
    } else if (m.type === "error") {
      addMsg("meta", "! " + m.text);
    } else if (m.type === "done") {
      botEl = null; setBusy(false);
    }
  };
  ws.onclose = () => { addMsg("meta", "desconectado, reintentando..."); setTimeout(connect, 1500); };
}
function setBusy(b) { busy = b; sendBtn.disabled = b; input.disabled = b; if (!b) input.focus(); }
function send() {
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== 1) return;
  addMsg("user", text); input.value = ""; botEl = null; setBusy(true);
  ws.send(text);
}
sendBtn.onclick = send;
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
connect();
</script>
</body>
</html>
